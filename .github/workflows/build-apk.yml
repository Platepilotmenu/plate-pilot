name: Build Plate Pilot Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          npm install

      - name: Initialize & Sync Capacitor Android
        run: |
          # Ensure Capacitor Android structure exists
          npx cap add android || true
          npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Output APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/plate-pilot.apk
          ls -la build-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plate-pilot-apk
          path: build-output/plate-pilot.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: Plate Pilot v1.0.0 - Android POS Release
          body: |
            ## 📱 Plate Pilot - Android POS Terminal & QR Dining

            Official compiled Android APK for Plate Pilot Restaurant Management System.

            ### Included Features:
            - ⚡ **Full POS Terminal** (Dine-in, Takeaway, Split bill, Cash/UPI)
            - 🔄 **Real-Time Supabase Cloud Sync** (Multi-device live order alerts)
            - 🍽️ **Table QR Ordering & KDS** (Instant kitchen pipeline updates)
            - 📊 **Owner Business Analytics** (Sales tracking & outlet controls)

            ### Installation:
            1. Download `plate-pilot.apk` below.
            2. Open on any Android tablet, phone, or POS terminal (Android 7.0+).
            3. Tap **Install** (Allow installation from this source if prompted).
          files: build-output/plate-pilot.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
